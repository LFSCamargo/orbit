name: Orbit Wine

# Builds Orbit Wine from the pinned CrossOver sources (scripts/wine) and
# publishes it as a GitHub release that onboarding installs from. Run by hand
# after changing scripts/wine; the release is never marked latest, so app
# updates keep pointing at the app's own releases.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbit-wine
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 300
    env:
      WORK: ${{ github.workspace }}/../orbit-wine-build
      # The Gcenx Wine Orbit signs in to Steam with; its x86_64 libraries,
      # SDL2 and Gecko are reused (same pin as services/steam_windows.rs).
      DEPS_URL: https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.21/wine-devel-11.21-osx64.tar.xz
      DEPS_SHA256: 9909b486657e10ab66c7279371ae1f990345b596b3b1b3a0cf21f28af24fa0ce
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="$(node -p "require('./scripts/wine/sources.json').crossover.version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=orbit-wine-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stop when this version is already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "${{ steps.version.outputs.tag }} already exists; bump sources.json or delete it first" >&2
            exit 1
          fi

      - name: Install build tools
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          brew install bison mingw-w64 freetype gnutls zstd

      - name: Fetch x86_64 libraries
        run: |
          mkdir -p "$WORK/deps-wine"
          curl -fL --proto '=https' -o "$WORK/deps-wine.tar.xz" "$DEPS_URL"
          echo "$DEPS_SHA256  $WORK/deps-wine.tar.xz" | shasum -a 256 -c -
          tar -xJf "$WORK/deps-wine.tar.xz" -C "$WORK/deps-wine"

      - name: Build
        run: |
          ORBIT_WINE_WORK="$WORK/build" \
          ORBIT_WINE_DEPS="$WORK/deps-wine/Wine Devel.app/Contents/Resources/wine/lib" \
          ORBIT_WINE_DEST="$WORK/out/${{ steps.version.outputs.version }}" \
            bash scripts/wine/build.sh

      - name: Package
        run: bash scripts/wine/package.sh "$WORK/out/${{ steps.version.outputs.version }}" "$WORK/release"

      # Uploaded as a draft and published once every asset is there, so Orbit
      # never reads a manifest whose archive is still uploading.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "Orbit Wine ${{ steps.version.outputs.version }}" \
            --latest=false \
            --notes "Orbit Wine ${{ steps.version.outputs.version }}, built from CodeWeavers' CrossOver sources with Orbit's patches (scripts/wine). LGPL-2.1-or-later: the matching sources are attached as orbit-wine-sources-${{ steps.version.outputs.version }}.tar.gz alongside the upstream CrossOver source tarball named in sources.json." \
            "$WORK"/release/*
          gh release edit "${{ steps.version.outputs.tag }}" --draft=false --latest=false
