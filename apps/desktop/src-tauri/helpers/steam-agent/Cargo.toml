[package]
name = "orbit-steam-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lightweight in-container Steam client: logs on with a saved token and hosts steamclient for the game. Built for x86_64-pc-windows-gnu only."

[[bin]]
name = "orbit-steam-agent"
path = "src/main.rs"

[dependencies]
orbit-steam = { path = "../../crates/orbit-steam" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_Security_Cryptography",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
