[workspace]
members = ["crates/orbit-motion", "crates/orbit-images"]
resolver = "2"

[package]
name = "orbit"
version = "0.3.0"
description = "Orbit — controller-first game launcher"
authors = ["Orbit"]
edition = "2021"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orbit-motion = { path = "crates/orbit-motion" }
orbit-images = { path = "crates/orbit-images" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
regex = "1"
walkdir = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
urlencoding = "2"
dotenvy = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
gilrs = "0.11"
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-game-controller = "0.3.2"


# Image preparation runs in a worker but must remain responsive in local development.
[profile.dev.package.orbit-images]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3
