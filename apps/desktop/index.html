<!doctype html>
<html lang="en" class="orbit-booting">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/brand/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <!-- Startup splash: inline so it paints before any script module or the
         app stylesheet loads. Onboarding's scene in miniature: the Orbit logo
         over the planet's horizon (its CSS planet: the Earth photo, a fire rim,
         atmosphere and sun bloom), meteors and twinkling sparkles. The WebGL
         globe would need Three.js first, so the splash uses the photo planet.
         src/app/splash/splash.ts dismisses it once Orbit is ready. -->
    <style>
      html,
      body {
        margin: 0;
        background: #07060a;
      }
      .orbit-booting #root {
        opacity: 0;
      }
      /* First run: onboarding (in #root) floats above the splash, which stays
         behind it until onboarding finishes. Home itself stays hidden. */
      html.orbit-splash-under-onboarding #root {
        position: relative;
        z-index: 2147483001;
        opacity: 1;
      }
      /* Entering: Home opens through an iris from the logo, over the
         leaving splash, out of a bright blur, with a fire ring riding the
         iris edge (html::after). Same timing, so the ring stays on the edge. */
      .orbit-entering #root {
        position: relative;
        z-index: 2147483001;
        animation: orbit-iris 1700ms cubic-bezier(0.7, 0, 0.3, 1) 200ms both;
      }
      @keyframes orbit-iris {
        from {
          clip-path: circle(0 at 50% 46%);
          transform: scale(1.08);
          filter: blur(14px) brightness(1.5);
        }
        60% {
          filter: blur(2px) brightness(1.1);
        }
        to {
          clip-path: circle(80vmax at 50% 46%);
          transform: none;
          filter: none;
        }
      }
      html.orbit-entering::after {
        content: '';
        position: fixed;
        left: 50%;
        top: 46%;
        z-index: 2147483002;
        width: 0;
        height: 0;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
        box-shadow:
          0 0 0 2px rgb(255 196 140 / 0.9),
          0 0 36px 8px rgb(255 120 48 / 0.6),
          inset 0 0 36px 8px rgb(255 120 48 / 0.45);
        animation: orbit-ring 1700ms cubic-bezier(0.7, 0, 0.3, 1) 200ms both;
      }
      @keyframes orbit-ring {
        from {
          width: 0;
          height: 0;
        }
        75% {
          opacity: 1;
        }
        to {
          width: 160vmax;
          height: 160vmax;
          opacity: 0;
        }
      }
      #orbit-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 100%, #1a0f10, #0a0709 55%, #07060a);
        /* Set by the inline script from the window size (planetGeometry). */
        --horizon: 84vh;
        --planet: 300vw;
      }
      #orbit-splash.orbit-splash--leaving {
        pointer-events: none;
        animation: splash-out 900ms ease 1000ms both;
      }
      @keyframes splash-out {
        to {
          opacity: 0;
        }
      }
      .splash-scene {
        position: absolute;
        inset: 0;
        animation: splash-fade-in 900ms ease both;
      }
      @keyframes splash-fade-in {
        from {
          opacity: 0;
        }
      }
      .splash-nebula {
        position: absolute;
        border-radius: 50%;
        filter: blur(26px);
        animation: splash-drift 16s ease-in-out infinite alternate;
      }
      @keyframes splash-drift {
        to {
          transform: translate(-3%, 6%) scale(1.06);
        }
      }
      .splash-sparkle {
        position: absolute;
        border-radius: 50%;
        background: #fff3e6;
        animation: splash-twinkle var(--period) ease-in-out var(--delay) infinite;
      }
      @keyframes splash-twinkle {
        0%,
        100% {
          opacity: var(--glow);
          transform: scale(1);
        }
        50% {
          opacity: 0.08;
          transform: scale(0.5);
        }
      }
      .splash-meteor {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgb(255 236 214);
        box-shadow:
          0 0 8px 3px rgb(255 170 100 / 0.7),
          0 0 18px 6px rgb(255 120 48 / 0.35);
        animation: splash-meteor var(--duration) linear var(--delay) infinite both;
      }
      .splash-meteor::before {
        content: '';
        position: absolute;
        top: 50%;
        width: 170px;
        height: 2px;
        border-radius: 2px;
        transform: translateY(-50%);
        background: linear-gradient(
          90deg,
          rgb(255 214 170),
          rgb(255 140 60 / 0.5) 35%,
          transparent
        );
      }
      @keyframes splash-meteor {
        0% {
          transform: rotate(215deg) translateX(0);
          opacity: 1;
        }
        70% {
          opacity: 1;
        }
        100% {
          transform: rotate(215deg) translateX(-1500px);
          opacity: 0;
        }
      }
      .splash-atmosphere {
        position: absolute;
        left: 50%;
        top: var(--horizon);
        width: 130vw;
        height: 60vh;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          50% 50% at 50% 50%,
          rgb(255 120 50 / 0.42),
          rgb(255 80 30 / 0.13) 50%,
          transparent 75%
        );
        animation: splash-breathe 6s ease-in-out infinite;
      }
      .splash-planet {
        position: absolute;
        left: 50%;
        top: var(--horizon);
        width: var(--planet);
        aspect-ratio: 1;
        transform: translateX(-50%);
        border-radius: 50%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 0%, #3a2218, #120c0d 7%, #08070a 20%);
        box-shadow:
          0 0 0 1.5px rgb(255 176 104 / 0.95),
          0 -3px 14px 1px rgb(255 150 70 / 0.9),
          0 -16px 60px 6px rgb(255 104 44 / 0.55);
      }
      .splash-planet-surface {
        position: absolute;
        inset: 0;
        animation: splash-turn 40s ease-in-out infinite alternate;
      }
      @keyframes splash-turn {
        from {
          transform: rotate(-4deg);
        }
        to {
          transform: rotate(4deg);
        }
      }
      .splash-planet img {
        position: absolute;
        left: 50%;
        /* As onboarding's CSS planet: width radius / 0.869, the arc at its top. */
        top: calc(var(--planet) * -0.1845);
        width: calc(var(--planet) * 0.5754);
        max-width: none;
        transform: translateX(-50%);
        opacity: 0.55;
        mix-blend-mode: luminosity;
        filter: grayscale(1) brightness(0.7) contrast(1.15);
        user-select: none;
      }
      .splash-planet::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 0%,
          rgb(255 120 50 / 0.3),
          rgb(140 50 20 / 0.12) 6%,
          transparent 14%
        );
        mix-blend-mode: screen;
      }
      .splash-bloom {
        position: absolute;
        left: 50%;
        top: var(--horizon);
        width: 70vw;
        height: 26vh;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          50% 50% at 50% 50%,
          rgb(255 200 140 / 0.55),
          rgb(255 130 50 / 0.25) 40%,
          transparent 72%
        );
        mix-blend-mode: screen;
        animation: splash-breathe 4.5s ease-in-out infinite;
      }
      @keyframes splash-breathe {
        50% {
          opacity: 0.7;
        }
      }
      .splash-logo-wrap {
        position: absolute;
        left: 50%;
        top: 46vh;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
      }
      .splash-logo-wrap::before {
        content: '';
        position: absolute;
        width: 160%;
        aspect-ratio: 2.4;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(255 122 61 / 0.28), transparent);
        filter: blur(24px);
        animation: splash-breathe 3s ease-in-out infinite;
      }
      .splash-logo {
        position: relative;
        /* The HD artwork has some transparent margin, so the mark itself is
           about 83% of this width. */
        width: min(430px, 52vw);
        height: auto;
        animation:
          splash-logo-in 1100ms cubic-bezier(0.2, 0.8, 0.2, 1) both,
          splash-float 5s ease-in-out 1100ms infinite;
      }
      @keyframes splash-logo-in {
        /* Opacity and position only. A scale would be drawn at its start size
           and stretched; a filter makes WebKit draw the layer at low
           resolution. Either left the logo blurry in the app. */
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }
      @keyframes splash-float {
        50% {
          transform: translateY(-6px);
        }
      }
      /* The 3D globe (src/app/splash/splashGlobe.tsx) fades in over the
         photo planet once it has drawn; the photo's surface then fades. */
      .splash-globe {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 700ms ease;
      }
      .splash-globe[data-ready] {
        opacity: 1;
      }
      .splash-planet-surface {
        transition: opacity 700ms ease;
      }
      #orbit-splash:has(.splash-globe[data-ready]) .splash-planet-surface {
        opacity: 0;
      }
      /* Leaving: the logo flies through the screen, the stars warp outward
         and the planet drops away as Home opens behind the iris. */
      .orbit-splash--leaving .splash-logo {
        animation: splash-through 1100ms cubic-bezier(0.55, 0, 0.2, 1) both;
      }
      @keyframes splash-through {
        to {
          opacity: 0;
          transform: scale(5);
          filter: blur(8px);
        }
      }
      .orbit-splash--leaving
        :is(.splash-planet, .splash-globe, .splash-atmosphere, .splash-bloom) {
        transition:
          translate 1300ms cubic-bezier(0.55, 0, 0.2, 1),
          scale 1300ms cubic-bezier(0.55, 0, 0.2, 1),
          opacity 1000ms ease;
        translate: 0 34vh;
        scale: 1.12;
        opacity: 0;
      }
      .orbit-splash--leaving .splash-stars {
        transition:
          scale 1300ms cubic-bezier(0.55, 0, 0.2, 1),
          opacity 1000ms ease;
        scale: 2.2;
        opacity: 0;
      }
      .splash-stars {
        position: absolute;
        inset: 0;
        transform-origin: 50% 46%;
      }
      @media (prefers-reduced-motion: reduce) {
        #orbit-splash *,
        #orbit-splash *::before {
          animation: none !important;
          transition: none !important;
        }
        .splash-meteor {
          display: none;
        }
        .orbit-entering #root {
          animation: splash-fade-in 300ms ease both;
        }
        html.orbit-entering::after {
          display: none;
        }
        #orbit-splash.orbit-splash--leaving {
          animation: splash-out 300ms ease both;
        }
      }
    </style>
  </head>
  <body>
    <div id="orbit-splash" aria-hidden="true">
      <div class="splash-scene">
        <div
          class="splash-nebula"
          style="
            left: -15vw;
            top: -20vh;
            width: 65vw;
            height: 75vh;
            background: radial-gradient(
              closest-side,
              rgb(255 90 45 / 0.3),
              rgb(200 50 30 / 0.1) 55%,
              transparent
            );
          "
        ></div>
        <div
          class="splash-nebula"
          style="
            right: -12vw;
            top: -18vh;
            width: 55vw;
            height: 65vh;
            background: radial-gradient(
              closest-side,
              rgb(255 160 80 / 0.2),
              rgb(180 90 40 / 0.07) 55%,
              transparent
            );
            animation-delay: -7s;
          "
        ></div>
        <div class="splash-stars"></div>
        <div class="splash-atmosphere"></div>
        <div class="splash-planet">
          <div class="splash-planet-surface">
            <img src="./src/assets/onboarding/globe.webp" alt="" draggable="false" />
          </div>
        </div>
        <div id="orbit-splash-globe" class="splash-globe"></div>
        <div class="splash-bloom"></div>
        <div class="splash-logo-wrap">
          <img
            class="splash-logo"
            src="./src/assets/brand/orbit-logo-hd.png"
            alt=""
            draggable="false"
            fetchpriority="high"
          />
        </div>
      </div>
    </div>
    <script>
      // Sparkles and meteors (fixed seeds, as in onboarding), and the planet
      // sized like onboarding's planetGeometry: its rim peaks at 84% of the
      // height and leaves through the bottom edge just inside each corner.
      ;(function () {
        var splash = document.getElementById('orbit-splash')
        if (!splash) return
        var seed = 7
        function random() {
          seed = (seed * 16807) % 2147483647
          return (seed - 1) / 2147483646
        }
        var html = ''
        for (var i = 0; i < 46; i++) {
          var near = i % 3 === 0
          var size = near ? 1.4 + random() * 1.8 : 0.7 + random() * 0.8
          var glow = near ? 0.55 + random() * 0.45 : 0.2 + random() * 0.3
          html +=
            '<span class="splash-sparkle" style="left:' +
            (random() * 100).toFixed(2) +
            '%;top:' +
            (random() * 72).toFixed(2) +
            '%;width:' +
            size.toFixed(2) +
            'px;height:' +
            size.toFixed(2) +
            'px;--glow:' +
            glow.toFixed(2) +
            ';--period:' +
            (2 + random() * 3.5).toFixed(2) +
            's;--delay:' +
            (-random() * 6).toFixed(2) +
            's;' +
            (near
              ? 'box-shadow:0 0 ' + (size * 3).toFixed(1) + 'px rgb(255 236 220/.6)'
              : '') +
            '"></span>'
        }
        // Meteors are already mid-flight on the first frame (negative delays),
        // so they streak across even a short splash.
        for (var m = 0; m < 18; m++) {
          var duration = 2.5 + random() * 2.5
          html +=
            '<span class="splash-meteor" style="left:' +
            ((m / 18) * 130 + random() * 6).toFixed(2) +
            '%;top:' +
            (-10 + random() * 35).toFixed(2) +
            '%;--delay:' +
            (-random() * duration).toFixed(2) +
            's;--duration:' +
            duration.toFixed(2) +
            's"></span>'
        }
        splash.querySelector('.splash-stars').innerHTML = html
        function size() {
          var w = window.innerWidth
          var h = window.innerHeight
          var top = h * 0.84
          var half = w * 0.47
          var sag = h - top
          var radius = (half * half + sag * sag) / (2 * sag)
          splash.style.setProperty('--horizon', top + 'px')
          splash.style.setProperty('--planet', radius * 2 + 'px')
        }
        size()
        window.addEventListener('resize', size)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
